name: symfonium
description: Symfonium iOS — WebDAV 高音質串流音樂播放器（Flutter）
publish_to: 'none'  # 私有專案，不上傳 pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 核心音訊播放與背景控制
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  # WebDAV 連線
  webdav_client: ^1.2.0
  # HTTP 基本驗證與檔案處理
  http: ^1.2.1
  path_provider: ^2.1.3
  # 狀態與 UI
  provider: ^6.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
